[workspace]
resolver = "2"
members = [
    "crates/ch422g",
    "crates/ws-esp32-s3-touch-lcd-5",
]
# ch422g is pure no_std + embedded-hal traits and builds/tests on host stable.
default-members = ["crates/ch422g"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"

[workspace.dependencies]
embedded-hal       = "1.0"
embedded-hal-async = "1.0"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "debuginfo"
debug         = 1
